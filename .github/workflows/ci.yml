name: CI

on:
  push:
    branches:
      - main
      - rasta-hisaab
      - dev
  pull_request:
    branches:
      - main
      - rasta-hisaab
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verification & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_KEY: ci-admin-key
      RASTABAAZ_TABLE_NAME: rastabaaz-ci
      AWS_REGION: ap-south-1
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source file line cap (<= 300 lines)
        run: npm run test:lines

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest test suites
        run: npx vitest run

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
