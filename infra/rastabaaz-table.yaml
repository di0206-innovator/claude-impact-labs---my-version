AWSTemplateFormatVersion: "2010-09-09"
Description: Rastabaaz single-table DynamoDB
Parameters:
  TableName:
    Type: String
    Default: rastabaaz
Resources:
  RastabaazTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byType
          KeySchema:
            - AttributeName: type
              KeyType: HASH
            - AttributeName: pk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - id
              - name
              - slug
              - issueType
              - lat
              - lng
              - street
              - ward
              - createdAt
              - locationId
              - noticedAt
              - noticedWindow
              - recurs
              - description
              - isSample
              - reportId
              - body
              - evidenceHash
Outputs:
  TableName:
    Value: !Ref RastabaazTable
  TableArn:
    Value: !GetAtt RastabaazTable.Arn
